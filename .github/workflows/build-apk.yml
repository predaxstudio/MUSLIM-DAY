name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare web application
        shell: bash
        run: |
          set -e
          mkdir -p build-wrapper/www

          rsync -a ./ build-wrapper/www/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='build-wrapper/' \
            --exclude='android/' \
            --exclude='dist/' \
            --exclude='package.json' \
            --exclude='package-lock.json'

          if [ ! -f build-wrapper/www/index.html ]; then
            echo "ERROR: index.html was not found."
            exit 1
          fi

      - name: Install Capacitor
        working-directory: build-wrapper
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6

      - name: Configure Android wrapper
        working-directory: build-wrapper
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.abdellah.muslimday",
            "appName": "Muslim Day",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          npx cap add android

      - name: Build APK
        working-directory: build-wrapper
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Muslim-Day-APK
          path: build-wrapper/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

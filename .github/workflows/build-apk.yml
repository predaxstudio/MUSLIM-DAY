name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        shell: bash
        run: |
          if [ -f "gradlew" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "android/gradlew" ]; then
            echo "PROJECT_DIR=android" >> "$GITHUB_ENV"
          else
            echo "ERROR: Android Gradle project not found."
            echo "A web-only project needs Android setup first."
            exit 1
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Muslim-Day-APK
          path: '/build/outputs/apk//*.apk'
          if-no-files-found: error
          retention-days: 7

name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Muslim Day APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare website files
        shell: bash
        run: |
          set -e
          mkdir -p wrapper/www

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='wrapper/' \
            --exclude='android/' \
            --exclude='build/' \
            ./ wrapper/www/

          test -f wrapper/www/index.html

      - name: Create Android project
        working-directory: wrapper
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.abdellah.muslimday",
            "appName": "Muslim Day",
            "webDir": "www"
          }
          EOF

          npx cap add android

      - name: Build APK
        working-directory: wrapper
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Muslim-Day-APK
          path: wrapper/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
